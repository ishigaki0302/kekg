[project]
name = "kekg"
version = "0.1.0"
description = "SRO Knowledge Editing Platform — mechanistic analysis of knowledge editing on synthetic KGs"
requires-python = ">=3.9,<3.13"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    # ROME vendored code requires these at import time
    "transformers>=4.30.0",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
viz = [
    "umap-learn>=0.5.0",
]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
]

[tool.uv]
# PyTorch CUDA wheels are on a separate index
# uv will automatically pick the right platform wheel
[[tool.uv.index]]
# GPU driver here is 535.x / CUDA 12.2, so torch must target CUDA <= 12.2.
# cu121 wheels are compatible with driver >= 525 (CUDA 12.1 runtime).
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[tool.ruff]
target-version = "py311"

[tool.black]
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
